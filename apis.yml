name: Raisin
description: >-
  Raisin is a fintech savings and investment marketplace that gives consumers
  access to high-yield savings accounts, CDs, and cash deposit products from a
  network of banks and credit unions through a single account and login.
  Founded in Berlin (originally as WeltSparen / SavingGlobal) and operating in
  the US, Germany, and across Europe, Raisin connects more than one million
  customers with partner banks, handling onboarding, KYC, account management,
  and deposit brokerage. Its sister entity Raisin Bank provides a
  Banking-as-a-Service platform for fintechs. Raisin exposes no public,
  self-serve developer API or documentation portal; integrations are
  partner-only and its consumer surface is web and mobile apps. Backed by Index
  Ventures and Ribbit Capital, this profile was added to the API Evangelist
  network as a fintech portfolio lead.
